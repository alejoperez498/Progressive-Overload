<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121316">
<title>Overload</title>
<style>
  :root{
    --bg:#121316;
    --surface:#1C1F23;
    --surface-2:#24272C;
    --border:#2E3237;
    --text:#F2F1ED;
    --text-2:#9A9DA3;
    --text-3:#6B6E73;
    --accent:#E8B023;
    --accent-ink:#1C1710;
    --danger:#E5534B;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Default size for every icon svg — Safari collapses un-sized inline SVGs
     inside flex containers to 0x0, so every icon needs an explicit size.
     More specific rules below (.brand svg, .checkbox svg, etc.) override this. */
  svg{width:18px; height:18px; flex-shrink:0; display:block;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #page{padding-bottom:calc(24px + var(--safe-b));}
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,select{font-family:inherit; color:inherit;}
  h1,h2,h3,p{margin:0;}

  /* ---------- Header ---------- */
  .topbar{
    padding:calc(18px + var(--safe-t)) 20px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand svg{width:20px; height:20px; flex-shrink:0;}
  .brand-name{font-size:19px; font-weight:700; letter-spacing:-0.01em;}
  .icon-group{display:flex; gap:8px;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border);
    transition:transform .12s ease;
  }
  .icon-btn:active{transform:scale(0.92);}

  /* ---------- Calendar ---------- */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px 4px;
  }
  .month-nav .month-label{font-size:17px; font-weight:600;}
  .month-nav-btns{display:flex; gap:6px;}
  .nav-arrow{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
  }
  .nav-arrow:active{transform:scale(0.92);}
  .weekday-row{
    display:grid; grid-template-columns:repeat(7,1fr);
    padding:14px 12px 2px; gap:2px;
  }
  .weekday-row span{
    text-align:center; font-size:12px; color:var(--text-3); font-weight:600;
  }
  .day-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    padding:2px 12px 8px; gap:2px;
  }
  .day-cell{
    position:relative;
    aspect-ratio:1/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:14px;
    gap:4px;
    transition:transform .1s ease;
  }
  .day-cell:active{transform:scale(0.93);}
  .day-cell.out{opacity:0.28;}
  .day-cell .num{font-size:15px;}
  .day-cell.is-today .num{
    color:var(--accent-ink); background:var(--accent);
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .dot-row{display:flex; gap:3px; height:5px;}
  .dot{width:5px; height:5px; border-radius:50%;}

  .legend{
    display:flex; flex-wrap:wrap; gap:14px;
    padding:18px 20px 6px;
  }
  .legend-item{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-2);}
  .legend-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}

  .link-row{
    margin:16px 20px 0;
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 16px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md);
  }
  .link-row .label{font-size:15px; font-weight:600;}
  .link-row .sub{font-size:12.5px; color:var(--text-2); margin-top:2px;}

  /* ---------- Generic page header (pushed screens) ---------- */
  .page-header{
    display:flex; align-items:center; gap:10px;
    padding:calc(14px + var(--safe-t)) 16px 14px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .back-btn{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%; background:var(--surface);
  }
  .back-btn:active{transform:scale(0.92);}
  .page-title{font-size:17px; font-weight:700;}
  .page-sub{font-size:12.5px; color:var(--text-2); margin-top:1px;}

  .routine-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:999px;
  }
  .routine-tag .dot{width:6px; height:6px; border-radius:50%;}

  /* ---------- Exercise list ---------- */
  .list-heading{
    padding:16px 20px 6px; font-size:12.5px; font-weight:700; color:var(--text-3);
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .ex-row{
    margin:6px 16px 0; padding:14px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:calc(100% - 32px);
  }
  .ex-row:active{transform:scale(0.99);}
  .ex-row .name{font-size:15.5px; font-weight:500;}
  .recent-pill{
    font-size:11px; font-weight:700; color:var(--accent);
    background:rgba(232,176,35,0.12); padding:3px 8px; border-radius:999px; margin-left:8px;
  }
  .checkbox{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--text-3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .checkbox.checked{background:var(--accent); border-color:var(--accent);}
  .checkbox svg{width:13px; height:13px; display:none;}
  .checkbox.checked svg{display:block;}

  .add-custom-row{
    margin:14px 16px 0; padding:10px 10px 10px 14px;
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-md);
    display:flex; align-items:center; gap:8px;
  }
  .add-custom-row input{
    flex:1; background:none; border:none; font-size:15px; color:var(--text); padding:8px 0;
  }
  .add-custom-row input::placeholder{color:var(--text-3);}
  .add-custom-row button{
    font-size:14px; font-weight:700; color:var(--accent-ink); background:var(--accent);
    padding:8px 14px; border-radius:var(--radius-sm);
  }

  /* ---------- Sticky footer ---------- */
  .footer-bar{
    position:sticky; bottom:0; left:0; right:0;
    padding:14px 16px calc(14px + var(--safe-b));
    background:linear-gradient(180deg, rgba(18,19,22,0) 0%, var(--bg) 40%);
  }
  .primary-btn{
    width:100%; padding:15px; text-align:center;
    background:var(--accent); color:var(--accent-ink);
    font-size:16px; font-weight:700; border-radius:var(--radius-md);
    transition:transform .1s ease, opacity .15s ease;
  }
  .primary-btn:active{transform:scale(0.98);}
  .primary-btn.disabled{opacity:0.35; pointer-events:none;}

  /* ---------- Exercise card (log sets) ---------- */
  .exercise-card{
    margin:14px 16px 0; padding:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  }
  .exercise-card .ex-title{font-size:15.5px; font-weight:700;}
  .exercise-card .last-time{font-size:12.5px; color:var(--text-2); margin-top:3px;}
  .set-header,.set-row{
    display:grid; grid-template-columns:28px 1fr 1fr 30px; gap:8px; align-items:center;
  }
  .set-header{margin-top:14px; padding:0 2px;}
  .set-header span{font-size:11px; color:var(--text-3); font-weight:700; text-transform:uppercase; letter-spacing:0.03em;}
  .set-row{margin-top:8px;}
  .set-num{font-size:13px; color:var(--text-2); font-weight:600; text-align:center;}
  .set-row input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:11px 10px; font-size:16px; text-align:center;
  }
  .set-row input::placeholder{color:var(--text-3); font-weight:400;}
  .remove-set{
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    color:var(--text-3);
  }
  .add-set-btn{
    margin-top:12px; font-size:14px; font-weight:600; color:var(--accent);
    display:flex; align-items:center; gap:5px;
  }

  /* ---------- Modal / sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; z-index:20;
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .sheet{
    width:100%; background:var(--surface); border-radius:22px 22px 0 0;
    padding:10px 20px calc(20px + var(--safe-b));
    max-height:82vh; overflow-y:auto;
    animation:slideUp .22s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
  .sheet-handle{
    width:36px; height:5px; border-radius:99px; background:var(--border);
    margin:6px auto 14px;
  }
  .sheet-title{font-size:17px; font-weight:700; text-align:center;}
  .sheet-date{font-size:13px; color:var(--text-2); text-align:center; margin-top:3px; margin-bottom:16px;}

  .routine-option{
    display:flex; align-items:center; gap:14px;
    padding:16px; margin-bottom:10px;
    background:var(--surface-2); border-radius:var(--radius-md); border:1px solid var(--border);
    width:100%; text-align:left;
  }
  .routine-option:active{transform:scale(0.98);}
  .routine-swatch{width:12px; height:44px; border-radius:6px; flex-shrink:0;}
  .routine-option .r-name{font-size:15.5px; font-weight:700;}
  .routine-option .r-sub{font-size:12.5px; color:var(--text-2); margin-top:2px;}
  .add-routine-option{background:transparent; border-style:dashed;}
  .add-swatch{
    width:44px; height:44px; border-radius:50%;
    border:1.5px dashed var(--text-3); display:flex; align-items:center; justify-content:center;
    color:var(--text-3); flex-shrink:0;
  }
  .add-swatch svg{width:18px; height:18px;}

  .cancel-btn{
    width:100%; padding:14px; text-align:center; margin-top:4px;
    background:var(--surface-2); border-radius:var(--radius-md);
    font-size:15.5px; font-weight:600; color:var(--text-2);
  }

  .routine-name-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:13px 14px; font-size:15.5px; color:var(--text);
    margin-bottom:16px;
  }
  .routine-name-input::placeholder{color:var(--text-3);}
  .color-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px;
  }
  .color-swatch{
    aspect-ratio:1/1; border-radius:50%; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .color-swatch.selected{border-color:var(--text);}
  .color-swatch svg{width:15px; height:15px;}
  .custom-routine-row{
    display:flex; align-items:center; gap:10px; padding:10px 2px;
    border-bottom:1px solid var(--border);
  }
  .custom-routine-row:last-child{border-bottom:none;}
  .routine-swatch-sm{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .cr-name{flex:1; font-size:14.5px; font-weight:500;}
  .cr-delete{width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--danger); flex-shrink:0;}

  .summary-ex{
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .summary-ex:last-child{border-bottom:none;}
  .summary-ex .ex-name{font-size:15px; font-weight:700;}
  .summary-ex .sets-line{font-size:14px; color:var(--text-2); margin-top:4px; line-height:1.5;}

  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions button{flex:1; padding:14px; border-radius:var(--radius-md); font-size:15px; font-weight:700;}
  .edit-action{background:var(--surface-2); color:var(--text);}
  .delete-action{background:rgba(229,83,75,0.12); color:var(--danger);}

  .confirm-text{font-size:14.5px; color:var(--text-2); text-align:center; padding:0 8px 16px;}

  /* ---------- Progress / Body weight pages ---------- */
  .ex-select-wrap{
    margin:14px 16px 0; padding:4px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  }
  .ex-select-wrap select{
    width:100%; background:none; border:none; padding:13px 0; font-size:15.5px; font-weight:600;
  }
  .ex-select-wrap select option{background:var(--surface);}
  .chart-card{
    margin:16px 16px 0; padding:18px 14px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md);
  }
  .chart-empty{
    padding:40px 20px; text-align:center; color:var(--text-2); font-size:14px;
  }
  .best-stat{display:flex; gap:24px; padding:0 4px 14px;}
  .best-stat div span{display:block;}
  .best-stat .val{font-size:22px; font-weight:700;}
  .best-stat .lbl{font-size:11.5px; color:var(--text-3); margin-top:2px; text-transform:uppercase; letter-spacing:0.03em;}
  .history-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 4px; border-bottom:1px solid var(--border); font-size:14px;
  }
  .history-row:last-child{border-bottom:none;}
  .history-row .h-date{color:var(--text-2);}
  .history-row .h-sets{color:var(--text); text-align:right; font-weight:600;}

  .bw-log-row{display:flex; gap:8px; align-items:center;}
  .bw-log-row input[type="date"]{
    flex:1.3; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:11px 8px; font-size:13.5px; color:var(--text);
  }
  .bw-log-row input[type="number"]{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:11px 10px; font-size:16px; text-align:center;
  }
  .bw-log-row button{
    font-size:14px; font-weight:700; color:var(--accent-ink); background:var(--accent);
    padding:11px 16px; border-radius:10px; flex-shrink:0;
  }

  .empty-state{
    padding:60px 30px; text-align:center;
  }
  .empty-state p{color:var(--text-2); font-size:14.5px; margin-top:6px;}

  /* ---------- Backup ---------- */
  .backup-banner{
    margin:14px 20px 0; padding:14px 16px;
    background:rgba(232,176,35,0.10); border:1px solid rgba(232,176,35,0.3);
    border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .bb-title{font-size:14px; font-weight:700; color:var(--accent);}
  .bb-sub{font-size:12px; color:var(--text-2); margin-top:2px;}
  .bb-actions{display:flex; gap:8px; flex-shrink:0;}
  .bb-actions button{font-size:13px; font-weight:700; padding:8px 12px; border-radius:8px;}
  .bb-save{background:var(--accent); color:var(--accent-ink);}
  .bb-dismiss{background:var(--surface-2); color:var(--text-2);}
  .secondary-btn{
    width:100%; padding:15px; text-align:center;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    font-size:16px; font-weight:700; border-radius:var(--radius-md);
  }
  .secondary-btn:active{transform:scale(0.98);}
  .backup-note{font-size:13px; color:var(--text-2); line-height:1.5; margin-bottom:14px;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="page"></div>
<div id="modal"></div>

<script>
/* ============================= CONFIG ============================= */
const DEFAULT_ROUTINES = [
  { key:'legs',  label:'Legs & Abs',    color:'#5FA777', builtin:true },
  { key:'upper', label:'Upper Body',    color:'#8E6FD1', builtin:true },
  { key:'chest', label:'Chest & Delts', color:'#5B8DEF', builtin:true },
  { key:'back',  label:'Back & Arms',   color:'#B0503F', builtin:true }
];
const DEFAULT_EXERCISES = {
  legs:  ['Barbell Back Squat','Romanian Deadlift','Leg Press','Walking Lunges','Leg Extension','Leg Curl','Standing Calf Raise','Hanging Leg Raise','Cable Crunch'],
  upper: ['Barbell Bench Press','Overhead Shoulder Press','Weighted Dips','Push-Ups'],
  chest: ['Incline Dumbbell Press','Cable Chest Fly','Lateral Raise','Front Raise','Rear Delt Fly'],
  back:  ['Deadlift','Pull-Ups','Barbell Row','Lat Pulldown','Face Pull','Barbell Bicep Curl','Hammer Curl','Tricep Pushdown','Skull Crushers']
};
const PRESET_COLORS = ['#5FA777','#5B8DEF','#8E6FD1','#B0503F','#E8B023','#4FB6B0','#D66FA6','#8C9A4B','#C9564F','#6E8FAE'];

/* ============================= UTIL ============================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }
function todayKey(){ const t=new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAY_LETTERS = ['S','M','T','W','T','F','S'];
function humanDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const wd = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()];
  return `${wd}, ${MONTH_NAMES[m-1]} ${d}`;
}
function shortDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${MONTH_NAMES[m-1].slice(0,3)} ${d}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function svgIcon(name){
  const icons = {
    barbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h2M6 8v8M6 12h12M18 8v8M20 12h2"/></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8a4.2 4.2 0 100 8M12 8v4l2.2 2.2"/></svg>',
    backup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>'
  };
  return icons[name] || '';
}

/* ============================= STORAGE ============================= */
// window.storage only exists inside Claude's own artifact environment.
// If this file is opened on its own (hosted, downloaded, etc.) fall back
// to localStorage under the same async get/set/delete/list shape, so the
// exact same code works in both places.
if (typeof window.storage === 'undefined') {
  window.storage = {
    async get(key){
      const raw = localStorage.getItem(key);
      if (raw === null) throw new Error('not found: ' + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key){
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    }
  };
}

let workoutLog = {};
let exerciseLibrary = {};
let routines = [];
let bodyWeightLog = {};
let backupMeta = {};
let dataReady = false;

function makeExFromName(name){ return { id: slugify(name)+'-'+Math.random().toString(36).slice(2,7), name, lastUsed:null }; }
function getRoutine(key){
  return routines.find(r=>r.key===key) || { key, label:'Deleted routine', color:'#6B6E73', builtin:false };
}

async function loadData(){
  try{
    const res = await window.storage.get('workout-log');
    workoutLog = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ workoutLog = {}; }

  try{
    const res = await window.storage.get('routines');
    routines = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ routines = null; }
  let routinesChanged = false;
  if(!routines || !routines.length){ routines = DEFAULT_ROUTINES.map(r=>({...r})); routinesChanged = true; }

  try{
    const res = await window.storage.get('exercise-library');
    exerciseLibrary = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ exerciseLibrary = null; }
  if(!exerciseLibrary) exerciseLibrary = {};
  let libraryChanged = false;
  routines.forEach(r=>{
    if(!exerciseLibrary[r.key]){
      exerciseLibrary[r.key] = (DEFAULT_EXERCISES[r.key]||[]).map(makeExFromName);
      libraryChanged = true;
    }
  });

  try{
    const res = await window.storage.get('body-weight-log');
    bodyWeightLog = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ bodyWeightLog = {}; }

  try{
    const res = await window.storage.get('backup-meta');
    backupMeta = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ backupMeta = {}; }

  if(routinesChanged) await saveRoutines();
  if(libraryChanged) await saveLibrary();
  dataReady = true;
}
async function saveWorkoutLog(){
  try{ await window.storage.set('workout-log', JSON.stringify(workoutLog)); }
  catch(e){ console.error('save workout-log failed', e); }
}
async function saveLibrary(){
  try{ await window.storage.set('exercise-library', JSON.stringify(exerciseLibrary)); }
  catch(e){ console.error('save exercise-library failed', e); }
}
async function saveRoutines(){
  try{ await window.storage.set('routines', JSON.stringify(routines)); }
  catch(e){ console.error('save routines failed', e); }
}
async function saveBodyWeightLog(){
  try{ await window.storage.set('body-weight-log', JSON.stringify(bodyWeightLog)); }
  catch(e){ console.error('save body-weight-log failed', e); }
}
async function saveBackupMeta(){
  try{ await window.storage.set('backup-meta', JSON.stringify(backupMeta)); }
  catch(e){ console.error('save backup-meta failed', e); }
}
function daysSinceLastBackup(){
  if(!backupMeta.lastBackupDate) return Infinity;
  const [y,m,d] = backupMeta.lastBackupDate.split('-').map(Number);
  const last = new Date(y, m-1, d);
  const now = new Date();
  return Math.floor((now - last) / (1000*60*60*24));
}

/* ============================= SHARED TREND CHART ============================= */
function renderTrendSVG(values, emptyNoun){
  if(values.length < 2){
    return `<div class="chart-empty">Log ${emptyNoun} on ${values.length===0?'two or more days':'one more day'} to see a trend line.</div>`;
  }
  const w = 300, h = 140, padX = 12, padY = 16;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const stepX = (w - padX*2) / (values.length-1);
  const points = values.map((v,i)=>{
    const x = padX + i*stepX;
    const y = padY + (1 - (v-min)/range) * (h - padY*2);
    return [x,y];
  });
  const path = points.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const dots = points.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:140px; display:block;">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

  Object.values(workoutLog).forEach(entry=>entry.exercises.forEach(e=>set.add(e.name)));

function sessionsForExercise(name){
  return Object.keys(workoutLog).sort().map(d=>{
    const entry = workoutLog[d];
    const found = entry.exercises.find(e=>e.name===name);
    if(!found) return null;
    const weights = found.sets.map(s=>Number(s.weight)||0);
    return { date:d, sets:found.sets, topWeight: Math.max(...weights,0) };
  }).filter(Boolean);
}

    </div>
    <div class="chart-card" style="margin-top:16px;">
      <div class="best-stat" style="padding-bottom:0;">
        <div><span class="val" style="font-size:16px;">${last}</span><span class="lbl">Last backup</span></div>
      </div>
    </div>
    <div class="chart-card">
      <div class="ex-title">Save a backup</div>
      <div class="backup-note" style="margin-top:8px;">
        Downloads everything — routines, exercises, workouts, body weight — as one file.
        iOS will hand you its normal download/share screen; choose <strong>Save to Files</strong>
        and pick your iCloud Drive folder to keep it there. There's no way for a web page to
        skip that tap and save silently in the background — that's an iOS restriction, not
        something specific to this app.
      </div>
      <button class="primary-btn" data-action="save-backup-now">Save backup</button>
    </div>
    <div class="chart-card">
      <div class="ex-title">Restore from backup</div>
      <div class="backup-note" style="margin-top:8px;">Replaces everything currently in the app with what's in the backup file.</div>
      <input type="file" id="restore-file-input" accept="application/json,.json" style="display:none;">
      <button class="secondary-btn" data-action="pick-restore-file">Choose backup file</button>
    </div>
  `;
}

/* ============================= ACTIONS ============================= */
function openDay(dateStr){
  state.modal = workoutLog[dateStr] ? {type:'daySummary', date:dateStr} : {type:'routinePicker', date:dateStr};
  render();
}
function chooseRoutine(dateStr, routineKey){
  state.selectedDate = dateStr;
  state.selectedRoutine = routineKey;
  state.selectedExercises = [];
  state.setsData = {};
  state.editing = false;
  state.modal = null;
  state.page = 'exercisePicker';
  render();
}
function openNewRoutine(dateStr){
  state.newRoutineColor = PRESET_COLORS[0];
  state.modal = {type:'newRoutine', date:dateStr};
  render();
}
function backToRoutinePicker(dateStr){
  state.newRoutineColor = null;
  state.modal = {type:'routinePicker', date:dateStr};
  render();
}
function pickRoutineColor(color){
  state.newRoutineColor = color;
  render();
}
async function createRoutine(dateStr){
  const nameInput = document.getElementById('new-routine-name');
  const name = (nameInput.value||'').trim();
  if(!name) return;
  const key = 'r-' + slugify(name) + '-' + Math.random().toString(36).slice(2,6);
  const color = state.newRoutineColor || PRESET_COLORS[0];
  routines.push({key, label:name, color, builtin:false});
  exerciseLibrary[key] = [];
  await saveRoutines();
  await saveLibrary();
  state.newRoutineColor = null;
  chooseRoutine(dateStr, key);
}
async function deleteRoutine(key){
  routines = routines.filter(r=>r.key!==key);
  delete exerciseLibrary[key];
  await saveRoutines();
  await saveLibrary();
  render();
}
function toggleExercise(name){
  const i = state.selectedExercises.indexOf(name);
  if(i>-1) state.selectedExercises.splice(i,1);
  else state.selectedExercises.push(name);
  render();
}
async function addCustomExercise(){
  const input = document.getElementById('custom-exercise-input');
  const name = (input.value||'').trim();
  if(!name) return;
  const routineKey = state.selectedRoutine;
  const exists = exerciseLibrary[routineKey].some(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!exists){
    exerciseLibrary[routineKey].push(makeExFromName(name));
    await saveLibrary();
  }
  if(!state.selectedExercises.includes(name)) state.selectedExercises.push(name);
  render();
}
function syncSetsFromDOM(){
  const cards = document.querySelectorAll('.exercise-card');
  state.selectedExercises.forEach((name, ei)=>{
    const card = cards[ei];
    if(!card) return;
    const rows = card.querySelectorAll('.set-row');
    state.setsData[name] = Array.from(rows).map(row=>({
      weight: row.querySelector('.weight-input').value,
      reps: row.querySelector('.reps-input').value
    }));
  });
}
function continueToLog(){
  state.selectedExercises.forEach(name=>{
    if(!state.setsData[name]) state.setsData[name] = [{weight:'',reps:''}];
  });
  state.page = 'logSets';
  render();
}
function addSet(exName){
  syncSetsFromDOM();
  state.setsData[exName].push({weight:'',reps:''});
  render();
}
function removeSet(exName, idx){
  syncSetsFromDOM();
  if(state.setsData[exName].length>1) state.setsData[exName].splice(idx,1);
  render();
}
async function saveWorkout(){
  syncSetsFromDOM();
  const exercises = state.selectedExercises.map(name=>({
    name,
    sets: state.setsData[name]
      .map(s=>({ weight: s.weight===''?0:Number(s.weight), reps: s.reps===''?0:Number(s.reps) }))
      .filter(s=>s.reps>0 || s.weight>0)
  })).filter(e=>e.sets.length>0);

  if(!exercises.length){
    state.page = 'calendar';
    render();
    return;
  }

  workoutLog[state.selectedDate] = { routine: state.selectedRoutine, exercises };
  await saveWorkoutLog();

  const routineKey = state.selectedRoutine;
  exercises.forEach(ex=>{
    const libEx = (exerciseLibrary[routineKey]||[]).find(e=>e.name===ex.name);
    if(libEx && (!libEx.lastUsed || state.selectedDate > libEx.lastUsed)) libEx.lastUsed = state.selectedDate;
  });
  await saveLibrary();

  state.page = 'calendar';
  state.modal = null;
  render();
}
function backFromPicker(){
  if(state.editing){ state.page='calendar'; state.modal={type:'daySummary', date:state.selectedDate}; }
  else { state.page='calendar'; }
  render();
}
function backFromLogSets(){
  syncSetsFromDOM();
  state.page = 'exercisePicker';
  render();
}
function editDay(dateStr){
  const entry = workoutLog[dateStr];
  state.selectedDate = dateStr;
  state.selectedRoutine = entry.routine;
  state.selectedExercises = entry.exercises.map(e=>e.name);
  state.setsData = {};
  entry.exercises.forEach(e=>{ state.setsData[e.name] = e.sets.map(s=>({weight:String(s.weight), reps:String(s.reps)})); });
  state.editing = true;
  state.modal = null;
  state.page = 'exercisePicker';
  render();
}
async function deleteDay(dateStr){
  delete workoutLog[dateStr];
  await saveWorkoutLog();
  state.modal = null;
  render();
}
function openProgress(){
  state.page = 'progress';
  render();
}
function openBodyWeight(){
  state.page = 'bodyweight';
  render();
}
async function saveBodyWeight(){
  const dateInput = document.getElementById('bw-date-input');
  const valInput = document.getElementById('bw-value-input');
  const d = dateInput.value;
  const v = Number(valInput.value);
  if(!d || valInput.value==='' || isNaN(v) || v<=0) return;
  bodyWeightLog[d] = v;
  await saveBodyWeightLog();
  state.bwInputDate = d;
  render();
}
function backToCalendar(){
  state.page = 'calendar';
  render();
}
function openBackupPage(){
  state.page = 'backup';
  render();
}
function buildBackupPayload(){
  return { app:'overload-backup', version:1, exportedAt:new Date().toISOString(), routines, exerciseLibrary, workoutLog, bodyWeightLog };
}
function triggerBackupDownload(){
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `overload-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function saveBackupNow(){
  triggerBackupDownload();
  backupMeta.lastBackupDate = todayKey();
  await saveBackupMeta();
  render();
}
async function saveBackupAndDismissBanner(){
  await saveBackupNow();
  state.backupBannerDismissed = true;
  render();
}
function dismissBackupBanner(){
  state.backupBannerDismissed = true;
  render();
}
function pickRestoreFile(){
  const input = document.getElementById('restore-file-input');
  if(input) input.click();
}
async function handleRestoreFile(file){
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    alert("Could not read that file — make sure it's an Overload backup .json file.");
    return;
  }
  if(!data || typeof data !== 'object' || !data.workoutLog || !data.exerciseLibrary || !data.routines){
    alert("This file doesn't look like a valid Overload backup.");
    return;
  }
  workoutLog = data.workoutLog || {};
  exerciseLibrary = data.exerciseLibrary || {};
  routines = (data.routines && data.routines.length) ? data.routines : DEFAULT_ROUTINES.map(r=>({...r}));
  bodyWeightLog = data.bodyWeightLog || {};
  await saveWorkoutLog();
  await saveLibrary();
  await saveRoutines();
  await saveBodyWeightLog();
  alert('Backup restored.');
  state.page = 'calendar';
  render();
}
function navMonth(dir){
  state.month += dir;
  if(state.month<0){ state.month=11; state.year--; }
  if(state.month>11){ state.month=0; state.year++; }
  render();
}

/* ============================= EVENT DELEGATION ============================= */
function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='open-day') openDay(el.dataset.date);
  else if(action==='choose-routine') chooseRoutine(el.dataset.date, el.dataset.routine);
  else if(action==='open-new-routine') openNewRoutine(el.dataset.date);
  else if(action==='back-to-routine-picker') backToRoutinePicker(el.dataset.date);
  else if(action==='pick-routine-color') pickRoutineColor(el.dataset.color);
  else if(action==='create-routine') createRoutine(el.dataset.date);
  else if(action==='delete-routine') deleteRoutine(el.dataset.key);
  else if(action==='close-modal'){ state.modal=null; render(); }
  else if(action==='dismiss-overlay'){ state.modal=null; render(); }
  else if(action==='toggle-exercise') toggleExercise(el.dataset.name);
  else if(action==='add-custom-exercise') addCustomExercise();
  else if(action==='continue-to-log') { if(state.selectedExercises.length) continueToLog(); }
  else if(action==='add-set') addSet(el.dataset.ex);
  else if(action==='remove-set') removeSet(el.dataset.ex, Number(el.dataset.idx));
  else if(action==='save-workout') saveWorkout();
  else if(action==='back-from-picker') backFromPicker();
  else if(action==='back-from-logsets') backFromLogSets();
  else if(action==='edit-day') editDay(el.dataset.date);
  else if(action==='ask-delete'){ state.modal = {type:'confirmDelete', date:el.dataset.date}; render(); }
  else if(action==='confirm-delete') deleteDay(el.dataset.date);
  else if(action==='open-progress') openProgress();
  else if(action==='open-body-weight') openBodyWeight();
  else if(action==='save-body-weight') saveBodyWeight();
  else if(action==='open-backup') openBackupPage();
  else if(action==='save-backup-now') saveBackupNow();
  else if(action==='save-backup-and-dismiss') saveBackupAndDismissBanner();
  else if(action==='dismiss-backup-banner') dismissBackupBanner();
  else if(action==='pick-restore-file') pickRestoreFile();
  else if(action==='back-to-calendar') backToCalendar();
  else if(action==='nav-month') navMonth(Number(el.dataset.dir));
}
document.getElementById('page').addEventListener('click', handleClick);
document.getElementById('modal').addEventListener('click', handleClick);
document.getElementById('modal').addEventListener('click', (e)=>{
  if(e.target.classList.contains('overlay')){ state.modal=null; render(); }
});
document.addEventListener('change', (e)=>{
  if(e.target.id==='progress-select'){ state.progressExercise = e.target.value; render(); }
  if(e.target.id==='restore-file-input' && e.target.files && e.target.files[0]){ handleRestoreFile(e.target.files[0]); }
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.id==='custom-exercise-input'){ e.preventDefault(); addCustomExercise(); }
  if(e.key==='Enter' && e.target.id==='new-routine-name'){ e.preventDefault(); }
});

/* ============================= BOOT ============================= */
async function boot(){
  document.getElementById('page').innerHTML = `<div class="empty-state"><p>Loading your log…</p></div>`;
  await loadData();
  render();
}
boot();
</script>
</body>
</html>
